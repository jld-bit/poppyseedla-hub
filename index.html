<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoppyseedLA | Vintage & Accessories</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
        header { text-align: center; padding: 60px 20px; background: white; border-bottom: 1px solid #eee; }
        h1 { margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        nav { display: flex; justify-content: center; gap: 15px; padding: 20px; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; }
        nav button { background: none; border: none; font-size: 1rem; cursor: pointer; color: #555; padding: 5px 10px; }
        nav button:hover { color: #000; font-weight: bold; }
        #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; padding: 40px; max-width: 1200px; margin: auto; }
        .product-card { background: white; border: 1px solid #e1e1e1; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; transition: transform 0.2s; }
        .product-image { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; background-color: #eaeaea; }
        .product-name { font-size: 14px; height: 3.6em; overflow: hidden; margin-bottom: 10px; line-height: 1.4; color: #333; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #000; margin-bottom: 20px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .buy-btn { background: #000; color: #fff; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .buy-btn:hover { background: #333; }
        .offer-btn { background: #fff; color: #000; padding: 12px; border: 2px solid #000; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        .offer-btn:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <header>
        <h1>PoppyseedLA</h1>
        <p>Curated vintage, accessories, and footwear.</p>
    </header>
    <nav>
        <button onclick="renderProducts('All')">All</button>
        <button onclick="renderProducts('Apparel')">Apparel</button>
        <button onclick="renderProducts('Footwear')">Footwear</button>
        <button onclick="renderProducts('Accessories')">Accessories</button>
        <button onclick="renderProducts('Kids')">Kids</button>
        <button onclick="renderProducts('Home')">Home</button>
        <button onclick="renderProducts('Electronics')">Electronics</button>
    </nav>
    <div id="product-grid">Loading inventory from CSV...</div>
    <script>
      let allProducts = [];
      const yourEmail = "customercare@poppyseedla.com";

      // Read the CSV directly!
      Papa.parse("inventory.csv", {
          download: true,
          header: true,
          complete: function(results) {
              allProducts = results.data.filter(item => item["Title"]); 
              renderProducts('All');
          },
          error: function(err) {
              document.getElementById('product-grid').innerText = "Error loading inventory.csv.";
          }
      });

      function assignCategory(title) {
          const t = title.toLowerCase();
          if (t.match(/nike|jordan|shoes|sneakers|cleats|boots|sandals|heels/)) return 'Footwear';
          if (t.match(/jacket|coat|hoodie|sweater|blazer|shirt|dress|skort|pants|jeans|shorts|scrub/)) return 'Apparel';
          if (t.match(/hat|cap|bag|wallet|sock|sunglasses|tie|scarf|purse/)) return 'Accessories';
          if (t.match(/lego|toy|doll|game|figure|plush|kids/)) return 'Kids';
          if (t.match(/coffee|mug|lantern|home|decor|plant|village/)) return 'Home';
          if (t.match(/printer|receiver|electronics|adaptor/)) return 'Electronics';
          return 'Other';
      }

      function renderProducts(category) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        
        const filtered = allProducts.filter(p => {
            if (category === 'All') return true;
            return assignCategory(p["Title"]) === category;
        });
        
        filtered.forEach(product => {
          const card = document.createElement('div');
          card.className = 'product-card';
          
          const price = parseFloat(product["Start price"] || product["Current price"] || 0).toFixed(2);
          const safeTitle = product["Title"].replace(/"/g, '&quot;');
          const emailSubject = encodeURIComponent(`Offer for ${product["Title"]}`);
          const emailBody = encodeURIComponent(`Hi PoppyseedLA,\n\nI would like to make an offer of $___ for the ${product["Title"]} (Listed at $${price}).\n\nThanks!`);

          // MAGIC TRICK: This tries the .jpg first. If it fails, it tries the .webp automatically!
          card.innerHTML = `
            <img src="images/${product["Item number"]}.jpg" 
                 alt="${safeTitle}" 
                 class="product-image" 
                 onerror="if(!this.dataset.retried){this.dataset.retried=true; this.src='images/${product["Item number"]}.webp';} else {this.style.display='none';}">
            <div class="product-name">${product["Title"]}</div>
            <div class="product-price">$${price}</div>
            <div class="btn-group">
                <button class="buy-btn" onclick="alert('Checkout link coming soon!')">Buy Now</button>
                <a href="mailto:${yourEmail}?subject=${emailSubject}&body=${emailBody}" style="text-decoration: none;">
                    <button class="offer-btn">Make Offer</button>
                </a>
            </div>
          `;
          grid.appendChild(card);
        });
      }
    </script>
</body>
</html>
