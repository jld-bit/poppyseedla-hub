<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PoppyseedLA | Vintage & Accessories</title>

  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.6.0/default/snipcart.css" />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #111;
    }

    .top-banner {
      background: #fff200;
      text-align: center;
      padding: 10px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .ebay-logo {
      height: 20px;
    }

    header {
      background: white;
      text-align: center;
      padding: 35px 20px 25px;
      position: relative;
    }

    header h1 {
      margin: 0 0 20px;
      font-size: 2rem;
    }

    .cart-button {
      position: absolute;
      right: 24px;
      top: 35px;
      background: #000;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
    }

    #product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: white;
      border: 1px solid #e1e1e1;
      padding: 20px;
      border-radius: 12px;
    }

    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-title {
      font-size: 1rem;
      line-height: 1.2;
      margin: 14px 0 8px;
      font-weight: 800;
    }

    .product-price {
      font-weight: 800;
      margin: 0;
    }

    .shipping-note {
      font-size: 0.9rem;
      color: #555;
      margin: 6px 0 0;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .quick-cart-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      background: black;
      color: white;
      border: none;
    }

    .quick-cart-btn:hover {
      opacity: 0.85;
    }

    @media (max-width: 700px) {
      .cart-button {
        position: static;
        margin-bottom: 18px;
      }
      #product-grid {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="top-banner">
    <span>Shop our full store on</span>
    <a href="https://www.ebay.com/str/poppyseedla" target="_blank" rel="noopener">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay" class="ebay-logo" />
    </a>
  </div>

  <header>
    <button class="cart-button snipcart-checkout" type="button">
      Cart 🛒 <span class="snipcart-items-count">0</span>
    </button>
    <h1>PoppyseedLA</h1>
  </header>

  <main id="product-grid">
    <!-- Example product card mapped directly to a Snipcart product ID -->
    <div class="product-card">
      <img src="images/266821921738.jpg" class="product-image" alt="Kenneth Cole Women Blue Bomber Jacket">
      <h3 class="product-title">Kenneth Cole Women Blue Bomber Jacket Full Zip Cut Out Small</h3>
      <p class="product-price">$20.00</p>
      <p class="shipping-note">Standard shipping calculated at checkout</p>
      <div class="card-actions">
        <button
          class="quick-cart-btn snipcart-add-item"
          type="button"
          data-item-id="266821921738"
          data-item-name="Kenneth Cole Women Blue Bomber Jacket Full Zip Cut Out Small"
          data-item-price="20.00"
          data-item-url="https://poppyseedla.com"
          data-item-image="https://poppyseedla.com/images/266821921738.jpg"
          data-item-shippable="true"
          data-item-weight="700"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </main>

  <div
    hidden
    id="snipcart"
    data-api-key="OWEyMGI2MTQtYWNiMi00MzAyLWJkOGQtOWFmMWRjNGM1NDIwNjM5MTc3ODY0MTM2NjA0NzM4"
    data-currency="usd">
  </div>

  <script async src="https://cdn.snipcart.com/themes/v3.6.0/default/snipcart.js"></script>
</body>
</html>
