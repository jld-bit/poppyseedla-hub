<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoppyseedLA | Vintage & Accessories</title>
</head>
<body>

    <header style="text-align: center; padding: 50px;">
        <h1>PoppyseedLA</h1>
        <p>Curated vintage, accessories, and footwear.</p>
    </header>

    <!-- Product Grid Container -->
    <div id="product-grid" style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center;"></div>

    <!-- Inventory Fetch Script -->
    <script>
      fetch('inventory.json')
        .then(response => response.json())
        .then(products => {
          const grid = document.getElementById('product-grid');
          
          products.forEach(product => {
            const card = document.createElement('div');
            card.style.border = "1px solid #eee";
            card.style.padding = "20px";
            card.style.borderRadius = "8px";
            card.style.width = "250px";
            card.style.boxShadow = "0 2px 5px rgba(0,0,0,0.1)";
            
            card.innerHTML = `
              <h3 style="font-size: 16px; height: 40px; overflow: hidden;">${product["Product Name"]}</h3>
              <p style="font-size: 18px; font-weight: bold; color: green;">$${product["Price"].toFixed(2)}</p>
              <button style="background: black; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Buy Now</button>
            `;
            
            grid.appendChild(card);
          });
        })
        .catch(error => console.error('Error loading inventory:', error));
    </script>

</body>
</html>
