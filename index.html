<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoppyseedLA | Vintage & Accessories</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.css" />
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; }
        .top-banner { background-color: #fff200; text-align: center; padding: 10px; font-weight: 600; font-size: 14px; }
        header { text-align: center; padding: 40px; background: white; }
        nav { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        nav button { background: none; border: none; font-size: 1rem; cursor: pointer; color: #555; }
        nav button:hover { color: #000; font-weight: bold; }
        #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; padding: 40px; max-width: 1200px; margin: auto; }
        .product-card { background: white; border: 1px solid #e1e1e1; padding: 20px; border-radius: 12px; }
        .product-image { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; border: none; background: none; font-weight: bold; color: #555; }
        .gallery-main { width: 100%; height: 300px; object-fit: contain; margin-bottom: 15px; }
        .gallery-thumbs { display: flex; gap: 10px; margin-bottom: 20px; }
        .thumb { width: 60px; height: 60px; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
        .buy-btn { background: #000; color: #fff; padding: 15px; border: none; font-weight: bold; cursor: pointer; flex: 2; }
        .offer-btn { background: #fff; border: 2px solid #000; padding: 15px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; color: #000; text-decoration: none; }
    </style>
</head>
<body>
    <div class="top-banner">Shop our full store on <a href="https://www.ebay.com/str/poppyseedla">eBay</a></div>
    <header><h1>PoppyseedLA</h1></header>
    <nav>
        <button onclick="renderProducts('All')">All</button>
        <button onclick="renderProducts('Apparel')">Apparel</button>
        <button onclick="renderProducts('Footwear')">Footwear</button>
    </nav>

    <div id="product-grid"></div>

    <div id="item-modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="document.getElementById('item-modal').style.display='none'">&times;</button>
            <img id="main-img" class="gallery-main" src="">
            <div id="thumbs" class="gallery-thumbs"></div>
            <h2 id="modal-title"></h2>
            <p id="modal-price"></p>
            <p id="modal-desc"></p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="buy-btn" class="buy-btn snipcart-add-item">Buy Now</button>
                <a id="modal-offer-btn" href="#" class="offer-btn">Make Offer</a>
            </div>
        </div>
    </div>

    <script>
      let allProducts = [];
      Papa.parse("inventory.csv", { download: true, header: true, complete: (results) => { allProducts = results.data.filter(p => p['Item number']); renderProducts('All'); } });

      function renderProducts(cat) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        allProducts.forEach(p => {
          grid.innerHTML += `<div class="product-card">
            <img src="images/${p['Item number']}.jpg" class="product-image" onclick="openModal('${p['Item number']}')">
            <h3>${p['Title']}</h3>
            <p>$${p['Start price']}</p>
          </div>`;
        });
      }

      function openModal(id) {
        const p = allProducts.find(x => x['Item number'] === id);
        document.getElementById('main-img').src = `images/${id}.jpg`;
        document.getElementById('modal-title').innerText = p['Title'];
        document.getElementById('modal-price').innerText = `Price: $${p['Start price']} | Shipping: $${p['Shipping']}`;
        document.getElementById('modal-desc').innerText = p['Description'];
        
        const thumbs = document.getElementById('thumbs');
        thumbs.innerHTML = `<img src="images/${id}.jpg" class="thumb" onclick="changeImg('images/${id}.jpg')">`;
        if(p['Image2']) thumbs.innerHTML += `<img src="images/${p['Image2']}" class="thumb" onclick="changeImg('images/${p['Image2']}')">`;
        if(p['Image3']) thumbs.innerHTML += `<img src="images/${p['Image3']}" class="thumb" onclick="changeImg('images/${p['Image3']}')">`;
        
        const btn = document.getElementById('buy-btn');
        btn.setAttribute('data-item-id', id);
        btn.setAttribute('data-item-name', p['Title']);
        btn.setAttribute('data-item-price', p['Start price']);
        btn.setAttribute('data-item-shipping', p['Shipping']);
        btn.setAttribute('data-item-image', `images/${id}.jpg`);
        
        document.getElementById('modal-offer-btn').href = `mailto:customercare@poppyseedla.com?subject=Offer for ${p['Title']}`;
        document.getElementById('item-modal').style.display = 'flex';
      }

      function changeImg(src) { document.getElementById('main-img').src = src; }
      function closeModal(e) { if(e.target.id === 'item-modal') document.getElementById('item-modal').style.display = 'none'; }
    </script>
    <script async src="https://cdn.snipcart.com/themes/v3.4.1/default/snipcart.js"></script>
    <div hidden id="snipcart" data-api-key="OWEyMGI2MTQtYWNiMi00MzAyLWJkOGQtOWFmMWRjNGM1NDIwNjM5MTc3ODY0MTM2NjA0NzM4
"></div>
</body>
</html>
