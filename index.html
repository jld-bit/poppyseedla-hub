<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PoppyseedLA Store</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
        nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <nav>
        <button onclick="filter('All')">All</button>
        <button onclick="filter('Men')">Men</button>
        <button onclick="filter('Women')">Women</button>
        <button onclick="filter('Kids')">Kids</button>
        <button onclick="filter('Home')">Home</button>
    </nav>

    <div id="product-grid">Loading...</div>

    <script>
      let products = [];
      fetch('inventory.json')
        .then(res => {
            if (!res.ok) throw new Error("Could not find inventory.json");
            return res.json();
        })
        .then(data => {
            products = data;
            console.log("Data loaded:", products);
            filter('All');
        })
        .catch(err => {
            document.getElementById('product-grid').innerText = "Error: " + err.message;
            console.error(err);
        });

      function filter(cat) {
        const grid = document.getElementById('product-grid');
        grid.innerHTML = '';
        const list = (cat === 'All') ? products : products.filter(p => p.Category === cat);
        
        if(list.length === 0) grid.innerText = "No items found in this category.";

        list.forEach(p => {
          const div = document.createElement('div');
          div.className = 'card';
          div.innerHTML = `<h3>${p["Product Name"]}</h3><p>$${p.Price}</p>`;
          grid.appendChild(div);
        });
      }
    </script>
</body>
</html>
