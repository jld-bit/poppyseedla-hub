<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PoppyseedLA | Vintage & Accessories</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <link
    rel="stylesheet"
    href="https://cdn.snipcart.com/themes/v3.6.0/default/snipcart.css"
  />

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #111; }
    .top-banner { background-color: #fff200; text-align: center; padding: 10px; font-weight: 600; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .ebay-logo { height: 20px; }
    header { text-align: center; padding: 36px 20px 24px; background: white; position: relative; }
    header h1 { margin: 0 0 22px; font-size: 2rem; }
    .header-search { display: flex; justify-content: center; align-items: center; width: 100%; }
    #search-input { width: 90%; max-width: 560px; padding: 14px 18px; border: 1px solid #ddd; border-radius: 999px; font-size: 1rem; outline: none; }
    .cart-button { position: absolute; right: 24px; top: 36px; background: #000; color: #fff; border: none; padding: 12px 18px; border-radius: 999px; font-weight: 700; cursor: pointer; }
    nav { display: flex; justify-content: center; gap: 15px; padding: 15px; background: white; border-top: 1px solid #f2f2f2; border-bottom: 1px solid #eee; flex-wrap: wrap; }
    nav button { background: none; border: none; font-size: 1rem; cursor: pointer; color: #555; padding: 8px 10px; }
    nav button:hover { color: #000; font-weight: bold; }
    #product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; padding: 40px; max-width: 1200px; margin: auto; }
    .product-card { background: white; border: 1px solid #e1e1e1; padding: 20px; border-radius: 12px; }
    .product-image { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; cursor: pointer; background: #eee; }
    .product-title { font-size: 1rem; margin: 14px 0 8px; font-weight: 700; }
    .product-price { font-weight: 700; margin: 0; }
    .card-actions { display: flex; gap: 10px; margin-top: 12px; }
    .view-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; background: #fff; color: #000; border: 2px solid #000; }
    .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 650px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; border: none; background: none; font-weight: bold; color: #555; }
    .gallery-main { width: 100%; height: 320px; object-fit: contain; margin-bottom: 15px; background: #f5f5f5; border-radius: 8px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-add-btn { background: #000; color: #fff; padding: 15px; border: none; font-weight: bold; cursor: pointer; flex: 2; border-radius: 8px; }
    .offer-btn { background: #fff; border: 2px solid #000; padding: 15px; font-weight: bold; cursor: pointer; flex: 1; text-align: center; color: #000; text-decoration: none; border-radius: 8px; }
  </style>
</head>

<body>
  <div class="top-banner">
    <span>Shop our full store on</span>
    <a href="https://www.ebay.com/str/poppyseedla" target="_blank" rel="noopener">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg" alt="eBay" class="ebay-logo"/>
    </a>
  </div>

  <header>
    <h1>PoppyseedLA</h1>
    <button class="cart-button snipcart-checkout" type="button">Cart 🛒 <span class="snipcart-items-count">0</span></button>
    <div class="header-search">
      <input id="search-input" type="text" placeholder="Search items..." oninput="handleSearch()" />
    </div>
  </header>

  <nav>
    <button type="button" onclick="renderProducts('All')">All</button>
    <button type="button" onclick="renderProducts('Apparel')">Apparel</button>
    <button type="button" onclick="renderProducts('Footwear')">Footwear</button>
    <button type="button" onclick="renderProducts('Accessories')">Accessories</button>
    <button type="button" onclick="renderProducts('Kids')">Kids</button>
    <button type="button" onclick="renderProducts('Home')">Home</button>
    <button type="button" onclick="renderProducts('Electronics')">Electronics</button>
  </nav>

  <main id="product-grid"></main>

  <div id="item-modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" type="button" onclick="closeModalNow()">&times;</button>
      <img id="main-img" class="gallery-main" src="" alt="Product image" />
      <h2 id="modal-title"></h2>
      <p id="modal-price"></p>
      <div id="modal-details" class="item-details"></div>
      <div id="modal-desc" class="item-description"></div>
      <div class="modal-actions">
        <button id="modal-add-btn" class="modal-add-btn snipcart-add-item" type="button">Add to Cart</button>
        <a id="modal-offer-btn" href="#" class="offer-btn">Make Offer</a>
      </div>
    </div>
  </div>

  <div hidden id="snipcart" data-api-key="OWEyMGI2MTQtYWNiMi00MzAyLWJkOGQtOWFmMWRjNGM1NDIwNjM5MTc3ODY0MTM2NjA0NzM4
      " data-currency="usd"
      ></div>

  <script async src="https://cdn.snipcart.com/themes/v3.6.0/default/snipcart.js"></script>

  <script>
    let allProducts = [];
    Papa.parse("inventory.csv", { download: true, header: true, skipEmptyLines: true, complete: function(results) { 
        allProducts = results.data.filter(p => p["Item number"] && p["Title"]); 
        renderProducts("All"); 
    }});

    function cleanPrice(value) { return Number(String(value).replace("$", "").replace(",", "").trim() || 0).toFixed(2); }
    function safeText(value) { return value ? String(value) : ""; }
    function absoluteImageUrl(url) { return window.location.origin + "/" + url; }
    function productPageUrl() { return window.location.origin + window.location.pathname; }

    function renderProducts(category) {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      const filtered = (category === "All") ? allProducts : allProducts.filter(p => assignCategory(p["Title"]) === category);
      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "product-card";
        const price = cleanPrice(p["Start price"]);
        card.innerHTML = `
          <img src="images/${p["Item number"]}.jpg" class="product-image" onclick="openModal('${p["Item number"]}')">
          <h3 class="product-title">${p["Title"]}</h3>
          <p class="product-price">$${price}</p>
          <div class="card-actions">
            <button class="view-btn" onclick="openModal('${p["Item number"]}')">View</button>
          </div>`;
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      const product = allProducts.find(item => String(item["Item number"]) === String(id));
      if (!product) return;
      const price = cleanPrice(product["Start price"]);
      const shipping = cleanPrice(product["Shipping"]);
      const imageUrl = "images/" + id + ".jpg";

      document.getElementById("main-img").src = imageUrl;
      document.getElementById("modal-title").innerText = product["Title"];
      document.getElementById("modal-price").innerText = `Price: $${price} | Shipping: $${shipping}`;
      
      const modalBtn = document.getElementById("modal-add-btn");
      modalBtn.setAttribute("data-item-id", id);
      modalBtn.setAttribute("data-item-name", product["Title"]);
      modalBtn.setAttribute("data-item-price", price);
      modalBtn.setAttribute("data-item-shipping", shipping);
      modalBtn.setAttribute("data-item-url", productPageUrl());
      modalBtn.setAttribute("data-item-image", absoluteImageUrl(imageUrl));

      document.getElementById("modal-offer-btn").href = "mailto:customercare@poppyseedla.com?subject=" + encodeURIComponent("Offer for " + product["Title"]);
      document.getElementById("item-modal").style.display = "flex";
    }

    function closeModal(event) { if (event.target.id === "item-modal") closeModalNow(); }
    function closeModalNow() { document.getElementById("item-modal").style.display = "none"; }
    function assignCategory(title) { /* Keep your existing category logic here */ return "Other"; }
  </script>
</body>
</html>
