<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PoppyseedLA | Vintage & Accessories</title>

  <!-- PapaParse for loading inventory.csv -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <!-- Snipcart Settings -->
  <script>
    window.SnipcartSettings = {
      publicApiKey: "OWEyMGI2MTQtYWNiMi00MzAyLWJkOGQtOWFmMWRjNGM1NDIwNjM5MTc3ODY0MTM2NjA0NzM4",
      loadStrategy: "on-user-interaction",
      currency: "usd"
    };

    (() => {
      var c, d;
      (d = (c = window.SnipcartSettings).version) != null || (c.version = "3.0");

      var s, S;
      (S = (s = window.SnipcartSettings).timeoutDuration) != null || (s.timeoutDuration = 2750);

      var l, p;
      (p = (l = window.SnipcartSettings).domain) != null || (l.domain = "cdn.snipcart.com");

      var w, u;
      (u = (w = window.SnipcartSettings).protocol) != null || (w.protocol = "https");

      var f =
        window.SnipcartSettings.version.includes("v3.0.0-ci") ||
        window.SnipcartSettings.version != "3.0" &&
        window.SnipcartSettings.version.localeCompare("3.4.0", void 0, {
          numeric: true,
          sensitivity: "base"
        }) === -1;

      var m = ["focus", "mouseover", "touchmove", "scroll", "keydown"];

      window.LoadSnipcart = o;

      document.readyState === "loading"
        ? document.addEventListener("DOMContentLoaded", r)
        : r();

      function r() {
        window.SnipcartSettings.loadStrategy
          ? window.SnipcartSettings.loadStrategy === "on-user-interaction" &&
            (m.forEach(t => document.addEventListener(t, o)),
            setTimeout(o, window.SnipcartSettings.timeoutDuration))
          : o();
      }

      var a = false;

      function o() {
        if (a) return;
        a = true;

        let head = document.getElementsByTagName("head")[0];
        let snipcartDiv = document.querySelector("#snipcart");

        let snipcartScript = document.querySelector(
          `script[src^="${window.SnipcartSettings.protocol}://${window.SnipcartSettings.domain}"][src$="snipcart.js"]`
        );

        let snipcartCss = document.querySelector(
          `link[href^="${window.SnipcartSettings.protocol}://${window.SnipcartSettings.domain}"][href$="snipcart.css"]`
        );

        if (!snipcartDiv) {
          snipcartDiv = document.createElement("div");
          snipcartDiv.id = "snipcart";
          snipcartDiv.setAttribute("hidden", "true");
          document.body.appendChild(snipcartDiv);
        }

        setSnipcartAttributes(snipcartDiv);

        if (!snipcartScript) {
          snipcartScript = document.createElement("script");
          snipcartScript.src =
            `${window.SnipcartSettings.protocol}://${window.SnipcartSettings.domain}/themes/v${window.SnipcartSettings.version}/default/snipcart.js`;
          snipcartScript.async = true;
          head.appendChild(snipcartScript);
        }

        if (!snipcartCss) {
          snipcartCss = document.createElement("link");
          snipcartCss.rel = "stylesheet";
          snipcartCss.type = "text/css";
          snipcartCss.href =
            `${window.SnipcartSettings.protocol}://${window.SnipcartSettings.domain}/themes/v${window.SnipcartSettings.version}/default/snipcart.css`;
          head.prepend(snipcartCss);
        }

        m.forEach(eventName => document.removeEventListener(eventName, o));
      }

      function setSnipcartAttributes(element) {
        if (!f) return;

        element.dataset.apiKey = window.SnipcartSettings.publicApiKey;

        if (window.SnipcartSettings.currency) {
          element.dataset.currency = window.SnipcartSettings.currency;
        }

        if (window.SnipcartSettings.addProductBehavior) {
          element.dataset.configAddProductBehavior = window.SnipcartSettings.addProductBehavior;
        }

        if (window.SnipcartSettings.modalStyle) {
          element.dataset.configModalStyle = window.SnipcartSettings.modalStyle;
        }

        if (window.SnipcartSettings.templatesUrl) {
          element.dataset.templatesUrl = window.SnipcartSettings.templatesUrl;
        }
      }
    })();
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #111;
    }

    .top-banner {
      background-color: #fff200;
      text-align: center;
      padding: 10px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .ebay-logo {
      height: 20px;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: white;
      position: relative;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .cart-button {
      position: absolute;
      right: 24px;
      top: 32px;
      background: #000;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-button:hover {
      opacity: 0.85;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 15px;
      background: white;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    nav button {
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #555;
      padding: 8px 10px;
    }

    nav button:hover {
      color: #000;
      font-weight: bold;
    }

    #product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .product-card {
      background: white;
      border: 1px solid #e1e1e1;
      padding: 20px;
      border-radius: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      background: #eee;
    }

    .product-title {
      font-size: 1rem;
      line-height: 1.2;
      margin: 14px 0 8px;
      font-weight: 700;
    }

    .product-price {
      font-weight: 700;
      margin: 0;
    }

    .view-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .view-btn:hover {
      opacity: 0.85;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      border: none;
      background: none;
      font-weight: bold;
      color: #555;
    }

    .gallery-main {
      width: 100%;
      height: 300px;
      object-fit: contain;
      margin-bottom: 15px;
      background: #f5f5f5;
      border-radius: 8px;
    }

    #modal-title {
      margin-bottom: 8px;
    }

    #modal-price {
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .buy-btn {
      background: #000;
      color: #fff;
      padding: 15px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      flex: 2;
      border-radius: 8px;
    }

    .buy-btn:hover {
      opacity: 0.85;
    }

    .offer-btn {
      background: #fff;
      border: 2px solid #000;
      padding: 15px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      text-align: center;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
    }

    .empty-message {
      text-align: center;
      padding: 50px;
      color: #777;
      grid-column: 1 / -1;
    }

    @media (max-width: 700px) {
      header {
        padding-bottom: 85px;
      }

      .cart-button {
        left: 50%;
        right: auto;
        top: 85px;
        transform: translateX(-50%);
      }

      #product-grid {
        padding: 20px;
      }

      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="top-banner">
    <span>Shop our full store on</span>
    <a href="https://www.ebay.com/str/poppyseedla" target="_blank" rel="noopener">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/1/1b/EBay_logo.svg"
        alt="eBay"
        class="ebay-logo"
      />
    </a>
  </div>

  <header>
    <h1>PoppyseedLA</h1>

    <button class="cart-button snipcart-checkout">
      Cart 🛒 <span class="snipcart-items-count">0</span>
    </button>
  </header>

  <nav>
    <button onclick="renderProducts('All')">All</button>
    <button onclick="renderProducts('Apparel')">Apparel</button>
    <button onclick="renderProducts('Footwear')">Footwear</button>
    <button onclick="renderProducts('Accessories')">Accessories</button>
    <button onclick="renderProducts('Kids')">Kids</button>
    <button onclick="renderProducts('Home')">Home</button>
    <button onclick="renderProducts('Electronics')">Electronics</button>
  </nav>

  <main id="product-grid"></main>

  <div id="item-modal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModalNow()">&times;</button>

      <img id="main-img" class="gallery-main" src="" alt="Product image" />

      <h2 id="modal-title"></h2>
      <p id="modal-price"></p>
      <p id="modal-details"></p>
      <p id="modal-desc"></p>

      <div class="modal-actions">
        <button id="buy-btn" class="buy-btn snipcart-add-item">
          Add to Cart
        </button>

        <a id="modal-offer-btn" href="#" class="offer-btn">
          Make Offer
        </a>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];

    Papa.parse("inventory.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,

      complete: function(results) {
        allProducts = results.data.filter(function(product) {
          return product["Item number"] && product["Title"];
        });

        renderProducts("All");
      },

      error: function(error) {
        console.error("CSV loading error:", error);

        document.getElementById("product-grid").innerHTML =
          '<p class="empty-message">Inventory could not load.</p>';
      }
    });

    function safeText(value) {
      return value ? String(value) : "";
    }

    function cleanPrice(value) {
      if (!value) return "0.00";

      return String(value)
        .replace("$", "")
        .replace(",", "")
        .trim();
    }

    function assignCategory(title) {
      const t = safeText(title).toLowerCase();

      if (t.match(/nike|jordan|shoes|sneakers|cleats|boots|sandals|heels/)) {
        return "Footwear";
      }

      if (t.match(/jacket|coat|hoodie|sweater|blazer|shirt|dress|skort|pants|jeans|shorts|scrub/)) {
        return "Apparel";
      }

      if (t.match(/hat|cap|bag|wallet|sock|sunglasses|tie|scarf|purse/)) {
        return "Accessories";
      }

      if (t.match(/lego|toy|doll|game|figure|plush|kids/)) {
        return "Kids";
      }

      if (t.match(/coffee|mug|lantern|home|decor|plant|village/)) {
        return "Home";
      }

      if (t.match(/printer|receiver|electronics|adaptor|adapter|camera|phone|tablet/)) {
        return "Electronics";
      }

      return "Other";
    }

    function renderProducts(category) {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";

      const filtered =
        category === "All"
          ? allProducts
          : allProducts.filter(function(product) {
              return assignCategory(product["Title"]) === category;
            });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-message">No products found.</p>';
        return;
      }

      filtered.forEach(function(product) {
        const itemNumber = safeText(product["Item number"]);
        const title = safeText(product["Title"]);
        const price = cleanPrice(product["Start price"]);
        const imageUrl = `images/${itemNumber}.jpg`;

        const card = document.createElement("div");
        card.className = "product-card";

        card.innerHTML = `
          <img src="${imageUrl}" class="product-image" alt="${escapeHtml(title)}">
          <h3 class="product-title">${escapeHtml(title)}</h3>
          <p class="product-price">$${price}</p>
          <button class="view-btn" type="button">View Item</button>
        `;

        card.querySelector(".product-image").addEventListener("click", function() {
          openModal(itemNumber);
        });

        card.querySelector(".view-btn").addEventListener("click", function() {
          openModal(itemNumber);
        });

        grid.appendChild(card);
      });
    }

    function openModal(id) {
      const product = allProducts.find(function(item) {
        return String(item["Item number"]) === String(id);
      });

      if (!product) return;

      const title = safeText(product["Title"]);
      const price = cleanPrice(product["Start price"]);
      const shipping = cleanPrice(product["Shipping"]);
      const description = safeText(product["Description"]);
      const imageUrl = `images/${id}.jpg`;

      document.getElementById("main-img").src = imageUrl;
      document.getElementById("main-img").alt = title;

      document.getElementById("modal-title").innerText = title;

      document.getElementById("modal-price").innerText =
        `Price: $${price} | Shipping: $${shipping}`;

      document.getElementById("modal-details").innerText =
        `${safeText(product["Brand"])} | ${safeText(product["Size"])} | ${safeText(product["Color"])} | ${safeText(product["Condition"])}`;

      document.getElementById("modal-desc").innerText = description;

      const buyBtn = document.getElementById("buy-btn");

      buyBtn.setAttribute("data-item-id", id);
      buyBtn.setAttribute("data-item-name", title);
      buyBtn.setAttribute("data-item-price", price);
      buyBtn.setAttribute("data-item-description", description);

      buyBtn.setAttribute(
        "data-item-url",
        window.location.origin + window.location.pathname
      );

      buyBtn.setAttribute(
        "data-item-image",
        window.location.origin + "/" + imageUrl
      );

      if (shipping && Number(shipping) > 0) {
        buyBtn.setAttribute("data-item-shippable", "true");
      } else {
        buyBtn.removeAttribute("data-item-shippable");
      }

      document.getElementById("modal-offer-btn").href =
        `mailto:customercare@poppyseedla.com?subject=${encodeURIComponent("Offer for " + title)}`;

      document.getElementById("item-modal").style.display = "flex";
    }

    function closeModal(event) {
      if (event.target.id === "item-modal") {
        closeModalNow();
      }
    }

    function closeModalNow() {
      document.getElementById("item-modal").style.display = "none";
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
